<!DOCTYPE html>
<html>

<head>
    <title>Tower Tide Gauge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>
    <script src="update.js"></script>
    <script src="Chart.min.js"></script>
    <script src="jquery-3.5.1.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=default"></script>
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCAod1NL-93chXYK_hmcn49HLBBpI_udsA&libraries=&v=weekly"
        async></script>
</head>

<body id="mainBody">
    <div class="header">
        <div class="header-right">
            <span onclick="OpenNavMenu()">&#9776;</span>
        </div>
        <div class="header-mid">
            <label class="CurrentLocation" id="CurrentLocation"></label>
        </div>
        <div class="header-left">
            <img src="Tower.png" height=32>
        </div>
    </div>
    <div class="Readings" id="Readings">
        <div><a href="http://towertidegauge.local">TowerTideGauge.local</a></div>
        <div><label>Device IP:</label><label id="localIP"></label></div>
        <div><label>Network IP:</label><label id="clientIP"></label></div>
        <div><label>Serial:</label><label id="serial"></label></div>
    </div>

    <div class="map" id="map"></div>


    <div class="SettingsContainer" id="SettingsContainer">
        <!--==============================================================-->
        <div class="Sensor" id="Sensor">
            <a class="title">Sensor Settings</a>
            <div>
                <label>Location</label>
                <input type="Text" id="Sensor_Location">
            </div>
            <div>
                <label>Latitude</label>
                <input type="text" size="10" class="input-box" id="Latitude" autocomplete="on">
            </div>
            <div>
                <label>Longitude</label>
                <input type="text" size="10" class="input-box" id="Longitude" autocomplete="on">
            </div>
            <div>
                <label>Set Time</a><br>
                    <button value="Clear" onclick="SetTime()">Set</button><br>
            </div>
            <div>
                <label>Time Zone</label>
                <select id="Sensor_TimeZone">
                    <option value="0">Melbourne, Canberra, Sydney</option>
                    <option value="1">Perth</option>
                    <option value="2">Brisbane</option>
                    <option value="3">Adelaide</option>
                    <option value="4">Darwin</option>
                    <option value="5">Hobart</option>
                    <option value="6">Amsterdam, Netherlands</option>
                    <option value="7">Athens, Greece</option>
                    <option value="8">Barcelona, Spain</option>
                    <option value="9">Berlin, Germany</option>
                    <option value="10">Brussels, Belgium</option>
                    <option value="11">Budapest, Hungary</option>
                    <option value="12">Copenhagen, Denmark</option>
                    <option value="13">Dublin, Ireland</option>
                    <option value="14">Geneva, Switzerland</option>
                    <option value="15">Helsinki, Finland</option>
                    <option value="16">Kyiv, Ukraine</option>
                    <option value="17">Lisbon, Portugal</option>
                    <option value="18">London, Great Britain</option>
                    <option value="19">Madrid, Spain</option>
                    <option value="20">Oslo, Norway</option>
                    <option value="21">Paris, France</option>
                    <option value="22">Prague, Czech Republic</option>
                    <option value="23">Roma, Italy</option>
                    <option value="24">Moscow, Russia</option>
                    <option value="25">St.Petersburg, Russia</option>
                    <option value="26">Stockholm, Sweden</option>
                    <option value="27">Auckland, Wellington</option>
                    <option value="28">HawaiiTime</option>
                    <option value="29">Alaska Time</option>
                    <option value="30">Pacific Time</option>
                    <option value="31">Mountain Time</option>
                    <option value="32">Mountain Time(Arizona, noDST)</option>
                    <option value="33">Central Time</option>
                    <option value="34">Eastern Time</option>
                    <option value="35">Atlantic Time</option>
                    <option value="36">Jakarta</option>
                    <option value="37">Jerusalem</option>
                    <option value="38">Singapore</option>
                    <option value="39">Ulaanbaatar, Mongolia</option>
                    <option value="40">Brazil, Sao Paulo</option>
                    <option value="41">Argentina</option>
                    <option value="42">Central America</option>
                </select>
            </div>
            <div>
                <label>Type</label>
                <select id="Sensor_Type">
                    <option value="1" selected>MPM4700</option>
                    <option value="2">RD92</option>
                    <option value="3">QTP101T</option>

                </select>
            </div>
            <div>
                <label>Offset(m)</label>
                <input type="number" size="7" class="input-box" id="Sensor_Offset" autocomplete="off" max="100"
                    min="-100" step="0.01">
            </div>
            <div>
                <label>Interval</label>
                <select id="Sensor_MeasurementInterval">
                    <option value="60">1 minute</option>
                    <option value="300">5 minutes</option>
                    <option value="600">10 minutes</option>
                    <option value="900" selected>15 minutes</option>
                    <option value="1800">30 minutes</option>
                    <option value="3600">60 minutes</option>
                </select>
            </div>
            <div>
                <label>Units</label>
                <select id="M_F">
                    <option value="0" onclick="ToggleMeasurementUnits();">Meters</option>
                    <option value="1" onclick="ToggleMeasurementUnits();">Feet</option>
                </select>

            </div>
            <div>
                <label>Clear all readings</label><br>
                <button value="Clear" onclick="DeleteTideHistory()">Clear</button>

            </div>
        </div>
        <!--==============================================================-->
        <div class="WiFi" id="WiFi">
            <a class="title">WiFi Settings</a>
            <div>
                <!--AP Settings-->
                <label for="WiFi_SSID">Network ID</label>
                <input type="text" class="input-box" id="WiFi_SSID">


                <label for="WiFi_Password">Password</label>
                <input type="password" class="input-box" id="WiFi_Password" autocomplete="off">
                <button onclick="ScanNetworks()">&#x1f4f6;</button>
            </div>
        </div>
        <!--==============================================================-->
        <div class="Radio" id="Radio">
            <a class="title">Radio Settings</a>
            <div>
                <label>Mode</label>
                <select id="Radio_OperationMode">
                    <option value="0" selected>Disabled</option>
                    <option value="1">Transmitter</option>
                    <option value="2">Receiver</option>
                    <option value="3">Repeater</option>
                    <option value="4">Dual</option>
                </select>
            </div>
        </div>
        <!--Update==============================================================-->
        <div class="Update" id="Update">
            <a class="title">Updates </a>
            <br>
            <label id="SerialNumber">--</label>
            <p></p>
            <div class="UpdateSource" id="LicenseNumber">
                <a class="title" id="SerialNumber">Active Licenses</a><br>
                <label id="ALRA">Radio Activated = False</label><br>
                <label id="ALWU">Web Upload = False</label><br>
                <label id="ALWI">Web Interface = False</label><br>
                <br>
                <a class="title">Load License</a>
                <form>
                    <input type="text" id="LicenseCode" name="myfile" value="">
                </form>
                <button class="button" id="UpdateFile" onclick="CheckLicenceCode()">Load</button>
            </div>
            <div class="UpdateSource">
                <a class="title">Firmware update</a><br> <label for="FirmwareVersion">Loaded Firmware: </label>
                <label id="FirmwareVersion"></label><br>
                <label for="ServerFWVersion">Latest Firmware: </label>
                <label id="ServerFWVersion"></label><br>
                <div class="AvailableFW" id=FWA onclick="DownloadFirmware()">Updated Firmware Available</div>
                <div class="settingSplit firmwareBox">
                    <form id="fw-updateForm">
                        <label for="fw-partition">Partition:</label>
                        <select class="select item" id="fw-partition">
                            <option value="0">Application</option>
                            <option value="1">Web & configuration filesystem</option>
                        </select>
                        <label for="fw-password">Password:</label>
                        <input id="fw-password" type="password" />
                        <label for="fw-file">Firmware file:</label>
                        <input class="fw-file" id="fw-file" type="file" onchange="calculateFileMD5(this)" />
                        <label for="fw-md5">MD5:</label>
                        <input id="fw-md5" type="text" disabled="true" />
                        <label for="fw-size">Filesize (B):</label>
                        <input id="fw-size" type="numeric" disabled="true" />
                        <input type="button" value="Update firmware" onclick="confirmUpdateFW();" />
                    </form>
                </div>
                <div id="disabledCover"></div>
                <div id="UpProg"> Uploading firmware: <span id="uploadProgress">0</span>
                    <div id="fwUpdateStatus">
                        <div id="fwUpdateText">
                        </div>
                    </div>
                </div>
                <span class="clear"></span>
            </div>
        </div>
        <!--Reset Button==============================================================-->
        <div class="ResetButton">
            <button id="ResetTideGauge" onclick="RestartESP()">Restart Tide Gauge</button>
        </div>
        <!--Save Button==============================================================-->
        <div id="SaveButton" class="SaveButton">
            <a class="title">Save Settings</a>
            <br>
            <button id="SaveSettings" onclick="SaveSettings()">&#10004;</button>
            <button id="CancelSettings" onclick="OpenSettings()">&#10008;</button>
        </div>
    </div>
    <!--Readings==============================================================-->
    <div class="Readings" id="Readings">
        <label id="CurrentTideTime"></label><br>
        <label id="CurrentTideValue"></label>
        <label id="CurrentTideUnits"></label><br>

        <canvas class="TideChart" id="TideChart"></canvas>
        <div class="TideTable" id="TideTable"></div>
    </div>
    <!--Password====================================================================-->
    <div class="PasswordForm" id="PasswordForm">
        <div class="PasswordForm-content">
            <a class="ClosePassword" onclick="CloseNavMenu()">&times;</a>
            <h1>Enter Password</h1>
            <input id="Password" name=pwd placeholder=Password type=Password>
            <input id="Submit" type=submit onclick=AdminCheck(this.form) value=Login></form>
        </div>
    </div>

    <!--Modal====================================================================-->
    <div id="ScanNetworkModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="Close" onclick="CloseModal();">&times;</span>
                <span onclick="RefreshNetworklist();">&#x21bb;</span>
                <b>Please select a network.</b>
            </div>
            <div class="modal-body">
                <div id="FoundNetworks"></div>
            </div>
        </div>
    </div>
    <!--Readings==============================================================-->
</body>

</html>
